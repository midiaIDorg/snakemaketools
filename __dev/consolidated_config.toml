[fragment_cluster_stats_config]
description = "Config of the fragment cluster statistics maker."
extension = ".toml"
config = "" # suspicere; amica mea




[matching_config]
# the config will be saved automatatically to 
# partial/matching_configs/{DB_assignedID}.toml
# the config should trigger what algorith to use
description = "Config of the rough maching between the precursor and fragment clusters."
extension=".toml" # this is likely more for the future
# partial/precursor_clustering_configs/{DB_assignedID}.config
[matching_config.config]
# if a config consists of a toml / json: specify it directly like so. otherwise: look at any clustering config. 
minimal_number_of_fragments_per_precursor = 3
maximal_number_of_fragments_per_precursor = 1_024
ms1_boxes_def = """
-- Definitions of 3D boxes in precursor space
-- These are very very big.

SELECT
ClusterID as MS1_ClusterID, 
frame_wmean - 20 as frame_min,
scan_wmean - 10 as scan_min,
mz_min - 5 as mz_min,
frame_wmean + 20 as frame_max,
scan_wmean + 10 as scan_max,
mz_max + 5 as mz_max
FROM '{ms1}'
WHERE
intensity > 30 AND peak_count >= 8
"""
ms2_boxes_def = """
-- Definitions of tiny point-like 3D boxes in fragment space
-- Each dim +- 0.001

SELECT
ClusterID as MS2_ClusterID, 
frame_wmean - 0.001 as frame_min,
scan_wmean - 0.001 as scan_min,
predicted_precursor_mz - 0.001 as mz_min,
frame_wmean + 0.001 as frame_max,
scan_wmean + 0.001 as scan_max,
predicted_precursor_mz + 0.001 as mz_max
FROM '{ms2}'
WHERE
peak_count >= 8
"""
silent = false







